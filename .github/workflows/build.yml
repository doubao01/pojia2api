name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 内核测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 运行单元测试
        run: ./gradlew :core:test :providers:test --no-daemon

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/build/reports/tests/

  apk:
    name: 构建 APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        # GitHub 的 ubuntu-latest 运行器已自带 Android SDK，直接用即可。
        # 原先固定 android-actions/setup-android@v3，该 action 一失败就会
        # 中断整个出包流程（第一次运行就是卡在这一步）。这里改为优先使用
        # 运行器自带 SDK，仅在确实缺失时才回退安装。
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "NEED_SETUP=true" >> "$GITHUB_ENV"
          else
            echo "使用运行器自带 Android SDK: $SDK"
            echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          fi

      - name: 回退安装 Android SDK
        if: env.NEED_SETUP == 'true'
        uses: android-actions/setup-android@v4

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-apk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-apk-

      - name: 构建 Debug APK
        env:
          MODELBRIDGE_LOOMY_APP_ID: ${{ secrets.MODELBRIDGE_LOOMY_APP_ID }}
          MODELBRIDGE_LOOMY_ACCESS_KEY: ${{ secrets.MODELBRIDGE_LOOMY_ACCESS_KEY }}
          MODELBRIDGE_LOOMY_SECRET: ${{ secrets.MODELBRIDGE_LOOMY_SECRET }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: modelbridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
